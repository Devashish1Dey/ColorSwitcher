<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorSwitcher</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="canvas">
        <h1 class="head">Color Scheme Switcher</h1>
        <div class="btn-div">
            <span class="button" id="red"></span>
            <span class="button" id="yellow"></span>
            <span class="button" id="green"></span>
            <span class="button" id="pink"></span>
            <span class="button" id="brown"></span>
            <span class="button" id="white"></span>
            <span class="button" id="blue"></span>
        </div>
        <h2 class="head2">Try Clicking on one of the colors above <span class="grey">to change the background color of this page!</span></h2>
    </div>
    <script src="script.js"></script>
</body>

</html>
